# Markdown lint/format configuration.
#
# docs/ is generated by tfplugindocs and must not be hand-edited, so it is
# excluded: its heading anchors, inline HTML and long schema description lines
# come from the generator and the provider schema, not from prose we control.

[global]
exclude = [
    "docs",
    ".github/ISSUE_TEMPLATE",
    ".github/pull_request_template.md",
]

[MD013]
line_length = 80
# Wrapping a shell pipeline, a Terraform heredoc or a Go snippet changes its
# meaning, so fenced code is exempt. Tables and headings are still checked.
code_blocks = false

[MD024]
# Changelog sections legitimately repeat "Added"/"Changed"/"Fixed" per release.
siblings_only = true
